site_name: Документация Мой ИТИ ХГУ
site_url: https://wiki.myiti.pro100byte.ru/
repo_url: https://github.com/PRO100BYTE/MyKHSU
repo_name: PRO100BYTE/MyKHSU

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Переключиться на тёмную тему
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Переключиться на светлую тему
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  icon:
    repo: fontawesome/brands/github
  favicon: assets/favicon.png
  logo: assets/logo.png

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PRO100BYTE/MyKHSU

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Главная: index.md
  - Проект:
    - Обзор: project/README.md
    - Архитектура: project/architecture.md
    - Диаграммы: project/diagrams.md
    - Соглашения по разработке: project/development-guidelines.md
    - Проверки качества PR: project/pr-quality-checks.md
    - Политика конфиденциальности: project/privacy-notice.md
    - Хранение данных: project/data-and-storage.md
  - Бэкенд:
    - Об��ор: backend/overview.md
    - Установка и запуск: backend/installation-and-run.md
    - Архитектура: backend/architecture.md
    - База данных: backend/database.md
    - API: backend/api.md
    - Развёртывание: backend/deployment.md
    - Веб-интерфейсы: backend/frontend.md
  - Компоненты:
    - Экраны: project/screens.md
    - Вводный экран: project/onboarding.md
    - Чеклист вводного экрана: project/onboarding-device-checklist.md
    - Дизайн сплэша: project/splash-design.md
    - Сезонные эффекты сплэша: project/splash-seasons.md
    - Меню разработчика: project/developer-menu.md
    - Нативные вкладки iOS: project/native-tabs.md
    - Верхняя панель: project/header-toolbar.md
    - Совместимость меню верхней панели: project/header-menu-fallback.md
    - Прямые действия панели инструментов: project/toolbar-direct-actions.md
    - Нативный UI модальных окон: project/modal-native-ui.md
    - Нативный UI карты: project/map-native-ui.md
    - Нативный UI настроек: project/settings-native-ui.md
    - Проверка нативного UI: project/native-ui-verification.md
    - Инструменты расписания: project/schedule-tools.md
    - Экспорт в галерею: project/gallery-export.md
    - Уведомления и фоновые задачи: project/notifications-and-background.md
    - Навигация по уведомлениям: project/notification-navigation.md
    - Доработки уведомл��ний: project/notifications-improvements.md
    - Календарь и фоновые проверки: project/calendar-background-compatibility.md
    - Поиск и контекстные действия: project/search-context-actions.md
    - Прокрутка под плавающим заголовком: project/screen-underlap.md
    - Змейка: project/snake.md
